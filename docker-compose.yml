# Full stack for local use:  cp .env.example .env  &&  docker compose up --build
# Then open http://localhost:8080 (see the README for demo data).
name: vinyl-vault

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: vinylvault
      MYSQL_USER: vinyl
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-vinyl}
    ports:
      # Bound to localhost only. 3307 (not 3306) so it never clashes with a MySQL you already run.
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # Executed once, on the first start with an empty volume.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/docker/02-test-database.sql:/docker-entrypoint-initdb.d/02-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # "development" prints e-mails (e.g. password recovery) to the log instead of sending them.
      # Use "production" only with real SMTP credentials (EMAIL_USER / EMAIL_PASS).
      NODE_ENV: ${NODE_ENV:-development}
      PORT: 3000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: vinyl
      DB_PASSWORD: ${MYSQL_PASSWORD:-vinyl}
      DB_NAME: vinylvault
      # Required (32+ chars). Left blank on purpose: `docker compose up mysql` must work without it,
      # and the API refuses to start with a clear message if it is missing.
      JWT_SECRET: ${JWT_SECRET:-}
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      FRONTEND_URL: ${PUBLIC_URL:-http://localhost:8080}
      # Proxies between the internet and the API: the bundled nginx is 1; add one for each
      # extra proxy in front of it (Caddy, Cloudflare...). Wrong values break per-IP rate limiting.
      TRUST_PROXY: ${TRUST_PROXY:-1}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_PASS: ${EMAIL_PASS:-}
      FEEDBACK_TO: ${FEEDBACK_TO:-}

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  mysql-data:
