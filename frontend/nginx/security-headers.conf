add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# What the app needs: its own files; images and audio from https (covers and previews from Apple, links
# pasted by users); the iTunes search API; inline handlers and styles (the screens use onclick="..." and
# style="..."). Everything user-supplied is escaped before it reaches the page (scripts/utils.js).
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' https: blob:; font-src 'self' data:; connect-src 'self' https://itunes.apple.com; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
